name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: new advisories appear without any commit
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check-secrets.mjs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Fails on: bad frontmatter, missing sections, broken links, unknown components, prerequisite cycles.
      - run: pnpm --filter @nexora/web content:check
      - run: pnpm --filter @nexora/web typecheck
      - run: pnpm --filter @nexora/web test
      - run: pnpm --filter @nexora/web build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: nexora_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/nexora_test
      COOKIE_SECRET: ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexora/api typecheck
      # Real Postgres, real migrations: the SQL constraints and upserts are what the tests are about.
      - run: pnpm --filter @nexora/api test
      - run: pnpm --filter @nexora/api build
      # The built server must apply its own migrations from a clean database.
      - run: pnpm --filter @nexora/api db:deploy

  ai:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: nexora_ai_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/nexora_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/ai/pyproject.toml }
      - run: pip install -e 'apps/ai[dev]' httpx
      # Real Postgres + pgvector, over the real lessons; includes the held-out retrieval/refusal quality floor.
      - run: python -m pytest -q -W ignore
        working-directory: apps/ai

  audit:
    # Known-vulnerability scan of production dependencies. Advisory data changes daily, so this can fail without a code change:
    # that is the point (and why it also runs on a weekly schedule, see the `schedule` trigger).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install ./apps/ai pip-audit && pip-audit --skip-editable

  docker:
    # Builds all three images exactly as the compose file does, brings the stack up, and drives it through the public
    # entrypoint with scripts/smoke.sh. This is the check that the Dockerfiles, migrations, service-to-service token and
    # request-id plumbing work together; nothing else in CI exercises them as one system.
    runs-on: ubuntu-latest
    needs: [web, api, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose up --build --wait --wait-timeout 300
      - run: scripts/smoke.sh http://localhost:3000
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - run: docker compose down -v
