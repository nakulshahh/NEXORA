[project]
name = "nexora-ai"
version = "0.6.0"
description = "NEXORA AI Professor: grounded retrieval over the curriculum. No paid APIs, no required API keys."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Real semantic embeddings (Sentence Transformers). Heavy: pulls PyTorch. See docs/AI.md "Hosting evaluation".
sbert = ["sentence-transformers>=3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
nexora-ai = "nexora_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexora_ai = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
